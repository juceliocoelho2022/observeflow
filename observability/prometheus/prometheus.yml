global:
  scrape_interval: 10s
scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
  - job_name: 'payment-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-service:8081']
  - job_name: 'fraud-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['fraud-service:8082']
  - job_name: 'ledger-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ledger-service:8083']
  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8084']