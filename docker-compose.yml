services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: observeflow
      POSTGRES_USER: observeflow
      POSTGRES_PASSWORD: observeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yml"]
    ports: ["3200:3200", "4317"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports: ["4317:4317", "4318:4318"]
    volumes:
      - ./observability/otel/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - otel-collector

  payment-service:
    build: ./payment-service
    ports:
      - "8081:8081"
    depends_on:
      - otel-collector

  fraud-service:
    build: ./fraud-service
    ports:
      - "8082:8082"
    depends_on:
      - otel-collector

  ledger-service:
    build: ./ledger-service
    ports:
      - "8083:8083"
    depends_on:
      - otel-collector

  user-service:
    build: ./user-service
    ports:
      - "8084:8084"
    depends_on:
      - otel-collector

volumes:
  postgres_data:
